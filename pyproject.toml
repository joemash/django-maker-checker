[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-maker-checker"
dynamic = ["version"]
authors = [{ name = "Josephat Macharia" }]
description = "Maker-checker (four-eyes) approval of sensitive changes for Django: tenant-configured rules, segregation of duties, SLA escalation and a full audit trail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["django", "maker-checker", "four-eyes", "approvals", "segregation-of-duties", "audit", "workflow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "Django>=5.2,<6.2",
    "django-fsm-2>=4.2,<5",
]

[project.optional-dependencies]
celery = ["celery>=5.3,<6"]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov",
    "coverage",
    "psycopg[binary]>=3.1",
    "celery>=5.3,<6",
    "ruff>=0.5",
    "tox",
    "bandit[toml]",
    "radon",
    "vulture",
    "pip-audit",
    "pre-commit>=3.0.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/joemash/django-maker-checker"
Documentation = "https://django-maker-checker.readthedocs.io"
Changelog = "https://github.com/joemash/django-maker-checker/blob/main/CHANGELOG.md"
Issues = "https://github.com/joemash/django-maker-checker/issues"

[tool.setuptools.dynamic]
version = { attr = "django_maker_checker.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["django_maker_checker*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
django_maker_checker = ["py.typed", "locale/*/LC_MESSAGES/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["django_maker_checker/migrations", "tests/testapp/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
]
ignore = [
    "S101",  # assert in tests
    "B904",  # raise ... from inside except: explicit where it matters
    "UP006", # typing.List etc. kept for readability with older reviewers
    "UP035",
    "UP045", # Optional[X] kept
    "UP007",
    "N818",  # ApprovalPending / ApprovalError names are part of the public API
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = ["tests", ".tox", "build", "dist"]
skips = ["B101"]
severity = "low"
confidence = "high"

[tool.coverage.run]
source = ["django_maker_checker"]
omit = ["django_maker_checker/migrations/*"]
