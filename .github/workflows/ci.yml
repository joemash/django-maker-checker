name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toxenv: [linting, quality, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tox
      - run: tox -e ${{ matrix.toxenv }}

  tests:
    name: ${{ matrix.toxenv }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", toxenv: py311-dj52, database: postgres }
          - { python: "3.12", toxenv: py312-dj52, database: postgres }
          - { python: "3.12", toxenv: py312-dj60, database: postgres }
          - { python: "3.12", toxenv: py312-dj61, database: postgres }
          - { python: "3.13", toxenv: py313-dj52, database: postgres }
          - { python: "3.13", toxenv: py313-dj60, database: postgres }
          - { python: "3.13", toxenv: py313-dj61, database: postgres }
          - { python: "3.14", toxenv: py314-dj52, database: postgres }
          - { python: "3.14", toxenv: py314-dj60, database: postgres }
          - { python: "3.14", toxenv: py314-dj61, database: postgres }
          - { python: "3.13", toxenv: py313-dj61, database: sqlite }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust  # disposable CI database, no password
          POSTGRES_DB: maker_checker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres@localhost:5432/maker_checker' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip tox
      - run: tox -e ${{ matrix.toxenv }}

  coverage:
    # One run with write access, separate from the read-only test matrix: it publishes the README coverage badge (to
    # the python-coverage-comment-action-data branch) on main, and comments coverage on pull requests.
    name: Coverage report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust  # disposable CI database, no password
          POSTGRES_DB: maker_checker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/maker_checker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip tox
      - run: tox -e py313-dj61
      - uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r docs/requirements.txt -e .
      - run: sphinx-build -W --keep-going -b html docs/source docs/build/html

  package:
    name: Build and check the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
