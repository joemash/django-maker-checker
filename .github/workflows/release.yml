name: Release

# Publishes to PyPI when a GitHub release is published, using PyPI trusted publishing (no API token stored here).
# One-time setup on PyPI: add this repository and the workflow "release.yml" with environment "pypi" as a trusted
# publisher for the django-maker-checker project.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import django_maker_checker as m; print(m.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
