[tox]
envlist =
    linting
    quality
    security
    py311-dj52
    py{312,313,314}-dj{52,60,61}

[testenv]
extras = dev
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
passenv = DATABASE_URL
commands =
    coverage erase
    coverage run -m pytest tests {posargs}
    coverage run --append -m pytest --ds tests.settings_single tests {posargs}
    coverage report --fail-under=90 --show-missing
    coverage xml

[testenv:linting]
skip_install = true
deps = ruff
commands =
    ruff check django_maker_checker tests
    ruff format --check django_maker_checker tests

[testenv:quality]
skip_install = true
deps =
    radon
    vulture
commands =
    radon cc django_maker_checker --min C
    radon mi django_maker_checker --min B
    vulture django_maker_checker vulture_whitelist.py --min-confidence 100 --sort-by-size

[testenv:security]
deps =
    pip-audit
    bandit[toml]
commands_pre =
    python -m pip install --quiet --upgrade pip
commands =
    pip-audit --skip-editable
    bandit -r django_maker_checker -c pyproject.toml -ll
